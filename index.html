<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- 링크 공유 미리보기(카카오톡·페이스북 등).
         og:image는 반드시 절대 주소여야 한다. 도메인을 바꾸면 아래 주소도 같이 바꿀 것.
         ?v= 는 캐시 무효화용이다. 이미지를 교체하면 숫자를 올려야 새 그림이 나간다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HairFit AI" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://hairfit-ai-tau.vercel.app/" />
    <meta property="og:title" content="HairFit AI — 회원 전용 헤어 시뮬레이션" />
    <meta property="og:description" content="사진 한 장으로 얼굴형에 맞는 스타일을 추천해 드립니다. 발급받으신 회원 코드로 입장하세요." />
    <meta property="og:image" content="https://hairfit-ai-tau.vercel.app/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="같은 사람의 머리 스타일 변화를 좌우로 비교한 사진" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HairFit AI — 회원 전용 헤어 시뮬레이션" />

    <meta name="twitter:image" content="https://hairfit-ai-tau.vercel.app/og-image.png?v=1" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

        animation: fade-in 0.3s ease-out;
      }
    </style>
