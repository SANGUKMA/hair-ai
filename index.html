<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>HairFit AI — 회원 전용 헤어 시뮬레이션</title>
    <meta name="description" content="사진 한 장으로 얼굴형에 맞는 헤어스타일을 추천하고, 바뀐 모습을 미리 보여드립니다." />

    <!-- 링크 공유 미리보기(카카오톡·페이스북 등).
         og:image는 반드시 절대 주소여야 한다. 도메인을 바꾸면 아래 주소도 같이 바꿀 것.
         이미지를 교체할 때는 파일명을 바꿔야 각 서비스의 이미지 캐시가 갱신된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HairFit AI" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://hairfit-ai-tau.vercel.app/" />
    <meta property="og:title" content="HairFit AI — 회원 전용 헤어 시뮬레이션" />
    <meta property="og:description" content="사진 한 장으로 얼굴형에 맞는 스타일을 추천해 드립니다. 발급받으신 회원 코드로 입장하세요." />
    <meta property="og:image" content="https://hairfit-ai-tau.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://hairfit-ai-tau.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="같은 사람의 머리 스타일 변화를 좌우로 비교한 사진" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HairFit AI — 회원 전용 헤어 시뮬레이션" />
    <meta name="twitter:description" content="사진 한 장으로 얼굴형에 맞는 스타일을 추천해 드립니다. 발급받으신 회원 코드로 입장하세요." />
    <meta name="twitter:image" content="https://hairfit-ai-tau.vercel.app/og-image.jpg" />

    <!-- 홈 화면 앱(PWA). 회원이 "홈 화면에 추가"하면 주소창 없이 전체 화면으로 실행된다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS는 manifest를 읽지 않아 아래 항목들이 따로 필요하다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HairFit AI" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
